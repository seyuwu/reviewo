name: fdp-local-test-bot
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fdp_local
      POSTGRES_PASSWORD: fdp_local_only
      POSTGRES_DB: fdp_local_bot
    ports:
      - "127.0.0.1:32208:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdp_local -d fdp_local_bot"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:32209:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:
